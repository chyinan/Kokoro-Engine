[package]
name = "tauri-appkokoro-engine"
version = "0.4.6"
description = "A cross-platform desktop virtual character interaction engine"
authors = ["chyinan"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
# Desktop only requires rlib. staticlib bundles all transitive dependencies into a 4GB archive on Windows MSVC.
# Re-add "cdylib" (Android) / "staticlib" (iOS) if building for mobile.
name = "tauri_appkokoro_engine_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
tempfile = "3"

[dependencies]
tempfile = "3"
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
# The locked tauri-macros 2.6 series exposes command names to Tauri Specta.
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive", "function", "serde_json"] }
specta-typescript = "=0.0.15"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
bytes = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart"] }
edge-tts-rust = "0.1.3"
eventsource-stream = "0.2"
futures = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "reqwest-native-tls", "transport-child-process", "transport-streamable-http-client-reqwest"] }
reqwest-mcp = { package = "reqwest", version = "0.13.2", default-features = false }
process-wrap = { version = "10", default-features = false, features = ["tokio1", "creation-flags", "job-object", "kill-on-drop", "process-group"] }
rand = "0.8"
async-trait = "0.1"
bincode = "1.3"
chrono = "0.4.43"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
anyhow = "1.0.101"
thiserror = "1"
fastembed = "5.9.0"
rquickjs = { version = "0.11", features = ["futures", "macro", "chrono", "loader"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs-next = "2"
uuid = { version = "1.20.0", features = ["v4"] }
base64 = "0.22.1"
hmac = "0.12"
sha2 = "0.10"
warp = "0.3"
filetime = "0.2"
screenshots = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
teloxide = { version = "0.13", features = ["macros"] }
sherpa-onnx = "1"
hound = "3"
bzip2 = "0.4"
tar = "0.4"
cpal = "0.15"
rubato = "0.14"
async-openai = { version = "0.34.0", features = ["rustls", "chat-completion", "model", "responses", "byot"] }
ndarray = "0.17"
ort = { version = "2.0.0-rc.9", default-features = false, features = ["ndarray", "load-dynamic"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[target.'cfg(windows)'.dependencies]
which = "8"
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
stress = []

[patch.crates-io]
# Explicit D-Bus return types for Rust 1.100's never-type fallback.
screenshots = { path = "vendor/screenshots" }

[dev-dependencies]
proptest = "1"
wiremock = "0.6"
tokio-test = "0.4"
tokio = { version = "1", features = ["test-util"] }

# Reduces disk usage from third-party dependencies by emitting line-level debuginfo only.
# Retains panic backtraces while dramatically shrinking PDB files.
# Main crate retains full debug = 2 for rich IDE variable inspection.
[profile.dev.package."*"]
debug = 1

[profile.test.package."*"]
debug = 1

# Release optimization of the application crate made chat turns hang on Windows.
# Keep dependencies optimized while compiling the app crate without optimizations.
[profile.release.package.tauri-appkokoro-engine]
opt-level = 0
