name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Check IPC contract
        run: npm run check:ipc

      - name: Run tests
        run: npm run test

      - name: Exercise Git Sentinel hooks (POSIX)
        run: |
          # 1. Verify tracked mode in Git index is 100755
          CHECKOUT_MODE=$(git ls-files -s .githooks/post-checkout | awk '{print $1}')
          MERGE_MODE=$(git ls-files -s .githooks/post-merge | awk '{print $1}')
          if [ "$CHECKOUT_MODE" != "100755" ] || [ "$MERGE_MODE" != "100755" ]; then
            echo "::error::Git hooks not tracked with mode 100755 (post-checkout: $CHECKOUT_MODE, post-merge: $MERGE_MODE)"
            exit 1
          fi

          # 2. Verify filesystem executable permission on Linux
          test -x .githooks/post-checkout || (echo "::error::.githooks/post-checkout is not executable" && exit 1)
          test -x .githooks/post-merge || (echo "::error::.githooks/post-merge is not executable" && exit 1)

          # 3. Verify core.hooksPath was configured by postinstall
          CURRENT_HOOKS=$(git config --get core.hooksPath || true)
          if [ "$CURRENT_HOOKS" != ".githooks" ]; then
            echo "::error::core.hooksPath is not .githooks (found: '$CURRENT_HOOKS')"
            exit 1
          fi

          # 4. Exercise post-checkout hook via branch checkout
          rm -f src-tauri/target/.branch-switched
          CURRENT_REF=$(git rev-parse HEAD)
          git checkout -b test-ci-sentinel-hook
          if [ ! -f src-tauri/target/.branch-switched ]; then
            echo "::error::post-checkout hook did not generate src-tauri/target/.branch-switched on branch checkout"
            exit 1
          fi

          # 5. Clean up marker and exercise post-merge hook
          rm -f src-tauri/target/.branch-switched
          .githooks/post-merge
          if [ ! -f src-tauri/target/.branch-switched ]; then
            echo "::error::post-merge hook failed to execute"
            exit 1
          fi
          rm -f src-tauri/target/.branch-switched

          # 6. Safely restore prior Git ref and remove temporary branch
          git checkout "$CURRENT_REF"
          git branch -D test-ci-sentinel-hook

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Validate Sherpa-ONNX cache
        shell: bash
        run: bash .github/scripts/validate-sherpa-onnx-cache.sh

      - name: Run tests
        run: cd src-tauri && cargo test --verbose

      - name: Run clippy
        run: cd src-tauri && cargo clippy -- -D warnings

  build-linux:
    name: Build Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Validate Sherpa-ONNX cache
        shell: bash
        run: bash .github/scripts/validate-sherpa-onnx-cache.sh

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Rust backend
        run: cd src-tauri && cargo build --verbose

  build-windows:
    name: Build Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Validate Sherpa-ONNX cache
        shell: bash
        run: bash .github/scripts/validate-sherpa-onnx-cache.sh

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Rust backend
        run: cd src-tauri && cargo build --verbose

  build-macos:
    name: Build Check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Validate Sherpa-ONNX cache
        shell: bash
        run: bash .github/scripts/validate-sherpa-onnx-cache.sh

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Rust backend
        run: cd src-tauri && cargo build --verbose
